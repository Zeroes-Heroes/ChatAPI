name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve app name, version and repository
        id: meta
        env:
          ECR_REPOSITORY_OVERRIDE: ${{ vars.ECR_REPOSITORY }}
        run: |
          APP="${GITHUB_REPOSITORY##*/}"
          VERSION="${GITHUB_REF_NAME#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a v<semver> tag"
            exit 1
          fi

          DEFAULT_REPOSITORY="$(echo "$APP" | tr '[:upper:]' '[:lower:]')"

          {
            echo "app=$APP"
            echo "version=$VERSION"
            echo "repository=${ECR_REPOSITORY_OVERRIDE:-$DEFAULT_REPOSITORY}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $APP:$VERSION"

      - name: Verify Turbo.csproj carries the tagged version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PROJECT_VERSION="$(
            grep -oE '<Version>[^<]+</Version>' Turbo/Turbo.csproj \
              | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          )"

          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::Turbo/Turbo.csproj is at ${PROJECT_VERSION:-unset} but the tag says $VERSION"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker build \
            -f ./Turbo/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Push the image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Summary
        env:
          ECR_REPOSITORY: ${{ steps.meta.outputs.repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Pushed \`${ECR_REPOSITORY}:${IMAGE_TAG}\` to ECR"
            echo ""
            echo "- Also tagged \`latest\`"
            echo "- No deploy job: this repository has no self-hosted runner yet"
          } >> "$GITHUB_STEP_SUMMARY"
