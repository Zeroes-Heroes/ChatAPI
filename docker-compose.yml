version: '3.4'

services:
  chatserver.api:
    container_name: Turbo
    env_file: .env
    restart: unless-stopped
    ports:
      - "443:8080"
    image: ${DOCKER_REGISTRY-}chatserverapi
    build:
      context: .
      dockerfile: ./Turbo/Dockerfile
    volumes:
      - ./chatappclient-93ff4-firebase-adminsdk-k2t2q-0f5d59c785.json:/app/chatappclient-93ff4-firebase-adminsdk-k2t2q-0f5d59c785.json
      - ./AuthKey_ZCC96MJZKQ.p8:/app/AuthKey_ZCC96MJZKQ.p8
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
  
  redis:
    container_name: TurboRedis
    image: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Stage 12 (plan/12-outbox-delivery.md): the durable broker behind outbox delivery. The API reaches it
  # through Delivery__ConnectionUri (e.g. amqp://guest:guest@rabbitmq:5672/) supplied by the same .env as
  # every other secret; with that variable unset the API starts exactly as before and the delivery
  # workers stay idle. The data volume keeps the durable queue across restarts, which is what makes a
  # published-but-not-yet-consumed task survive a broker restart.
  rabbitmq:
    container_name: TurboRabbitMQ
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data: